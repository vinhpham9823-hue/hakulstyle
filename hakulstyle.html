<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKUL | Premium Men's Grooming</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter (Body) & Oswald (Display) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            900: '#07101e', // Darkest Navy (Backgrounds)
                            800: '#0a192f', // Base Navy (Main Theme)
                            700: '#112240', // Lighter Navy (Cards/Hover)
                            600: '#233554', // Borders/Dividers
                            500: '#495670', // Muted Text
                        },
                        cream: '#F9FAFB', // Off-white for stark contrast
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a192f;
        }
        ::-webkit-scrollbar-thumb {
            background: #233554;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #495670;
        }

        /* Hide scrollbar for horizontal lists but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background-color: #F9FAFB;
            color: #0a192f;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Subtle page entrance animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        /* Toast animation */
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* Grid Item staggered animation */
        .grid-item {
            opacity: 0;
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col"></div>

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PRODUCTS = [
            { id: 1, title: "Sáp Khử Mùi Old Spice High Endurance Pure Sport", desc: "Chuẩn Mỹ - 85g", icon: "fa-prescription-bottle" },
            { id: 3, title: "Dầu Gội Head & Shoulders Clinical Strength", desc: "Trị gàu nặng - 400ml", icon: "fa-pump-soap" },
            { id: 5, title: "Dao Cạo Râu Gillette Fusion 5 (1 Cán + 2 Lưỡi)", desc: "Nội địa Mỹ", icon: "fa-razor" },
        ];

        const NavBar = ({ toggleSearch }) => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-4' : 'bg-transparent py-6'}`}>
                    <div className="max-w-[1400px] mx-auto px-6 md:px-12 flex justify-between items-center">
                        {/* Menu Toggle (Mobile) / Empty div for balance (Desktop) */}
                        <div className="flex-1 md:hidden">
                            <button className="text-navy-800 text-xl"><i className="fas fa-bars"></i></button>
                        </div>
                        <div className="flex-1 hidden md:block">
                            <span className="text-sm font-medium tracking-widest text-navy-800 hover:text-navy-500 cursor-pointer transition">ABOUT US</span>
                        </div>

                        {/* Brand Logo */}
                        <div className="flex-1 text-center cursor-pointer">
                            <h1 className="font-display font-bold text-3xl md:text-4xl tracking-[0.15em] text-navy-800 uppercase">
                                Hakul
                            </h1>
                        </div>

                        {/* Actions */}
                        <div className="flex-1 flex justify-end items-center gap-6">
                            <button onClick={toggleSearch} className="text-navy-800 hover:text-navy-500 transition">
                                <i className="fas fa-search text-lg"></i>
                            </button>
                            <a href="https://shopee.vn/hakullifestyle" target="_blank" rel="noopener noreferrer" className="relative cursor-pointer group">
                                <i className="fas fa-shopping-bag text-lg text-navy-800 group-hover:text-navy-500 transition"></i>
                            </a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <div className="relative bg-navy-800 text-white pt-32 pb-20 md:pt-48 md:pb-32 px-6 overflow-hidden flex items-center justify-center min-h-[60vh]">
                {/* Abstract subtle background pattern/shapes */}
                <div className="absolute top-0 right-0 w-[800px] h-[800px] bg-navy-700 rounded-full blur-3xl opacity-20 -translate-y-1/2 translate-x-1/3"></div>
                <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-navy-700 rounded-full blur-3xl opacity-20 translate-y-1/3 -translate-x-1/4"></div>
                
                <div className="relative z-10 text-center max-w-4xl mx-auto animate-fade-in">
                    <p className="text-navy-500 font-medium tracking-[0.2em] text-xs md:text-sm mb-6 uppercase">The Art of Grooming</p>
                    <h2 className="font-display font-bold text-5xl md:text-7xl lg:text-8xl tracking-tight leading-none mb-8 uppercase text-cream">
                        Elevate Your <br/> Daily Routine
                    </h2>
                    <p className="text-gray-400 font-light text-base md:text-lg max-w-xl mx-auto mb-10">
                        Tuyển tập các sản phẩm chăm sóc cá nhân cao cấp dành riêng cho nam giới. Nhập khẩu chính hãng, chất lượng nguyên bản.
                    </p>
                    <a href="https://shopee.vn/hakullifestyle" target="_blank" rel="noopener noreferrer" className="inline-block bg-cream text-navy-900 font-medium tracking-widest text-sm px-10 py-4 hover:bg-white hover:scale-105 transition-all duration-300">
                        KHÁM PHÁ NGAY
                    </a>
                </div>
            </div>
        );

        const ProductCard = ({ product, index }) => {
            return (
                <a 
                    href="https://shopee.vn/hakullifestyle"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="group cursor-pointer grid-item flex flex-col h-full block"
                    style={{ animationDelay: `${index * 0.1}s` }}
                >
                    {/* Minimalist Image Container */}
                    <div className="aspect-[4/5] bg-gray-100 flex items-center justify-center relative overflow-hidden transition-colors duration-500 group-hover:bg-[#E2E8F0]">
                        <i className={`fas ${product.icon} text-7xl text-navy-800/20 group-hover:text-navy-800 transition-all duration-500 group-hover:scale-110`}></i>
                        
                        {/* Hover Overlay Button */}
                        <div className="absolute bottom-0 w-full p-4 translate-y-full opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 ease-out z-10">
                            <div className="w-full bg-navy-800 text-white text-center font-medium text-sm py-3 hover:bg-navy-700 transition">
                                MUA TRÊN SHOPEE
                            </div>
                        </div>
                    </div>

                    {/* Typography-focused Info */}
                    <div className="pt-5 pb-2 flex-1 flex flex-col">
                        <p className="text-xs font-medium tracking-wider text-navy-500 mb-1 uppercase">{product.desc}</p>
                        <h3 className="font-medium text-navy-800 leading-snug line-clamp-2 text-[15px] mb-3 group-hover:text-navy-600 transition-colors">
                            {product.title}
                        </h3>
                    </div>
                </a>
            );
        };

        function App() {
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");

            const filteredProducts = useMemo(() => {
                let result = PRODUCTS;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(p => p.title.toLowerCase().includes(q));
                }
                return result;
            }, [searchQuery]);

            return (
                <div className="bg-cream min-h-screen selection:bg-navy-800 selection:text-white">
                    <NavBar toggleSearch={() => { setIsSearchOpen(!isSearchOpen); setTimeout(() => document.getElementById('searchInput')?.focus(), 100); }} />
                    
                    {/* Fullscreen Search Overlay */}
                    {isSearchOpen && (
                        <div className="fixed inset-0 bg-white/95 backdrop-blur-md z-[100] flex flex-col animate-fade-in">
                            <div className="max-w-[1400px] w-full mx-auto px-6 py-8 flex justify-end">
                                <button onClick={() => { setIsSearchOpen(false); setSearchQuery(""); }} className="text-3xl text-navy-800 hover:rotate-90 transition-transform duration-300">
                                    <i className="font-light">×</i>
                                </button>
                            </div>
                            <div className="flex-1 flex flex-col items-center justify-center px-6 -mt-20">
                                <input 
                                    id="searchInput"
                                    type="text" 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="TÌM KIẾM SẢN PHẨM..." 
                                    className="text-3xl md:text-5xl font-display font-light bg-transparent border-b-2 border-navy-800 outline-none text-center text-navy-800 w-full max-w-3xl pb-4 placeholder-navy-800/30"
                                />
                                {searchQuery && (
                                    <button 
                                        onClick={() => setIsSearchOpen(false)}
                                        className="mt-10 font-medium tracking-widest text-sm bg-navy-800 text-white px-8 py-3 hover:bg-navy-700 transition"
                                    >
                                        XEM {filteredProducts.length} KẾT QUẢ
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    <Hero />

                    {}
                    <main className="max-w-[1400px] mx-auto px-6 md:px-12 py-20">
                        
                        {/* Section Header */}
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-8">
                            <div>
                                <h2 className="font-display text-3xl md:text-4xl font-bold uppercase tracking-wide text-navy-900">
                                    Best Sellers
                                </h2>
                                <p className="text-navy-500 mt-2 font-light">Top 3 sản phẩm được yêu thích nhất.</p>
                            </div>
                        </div>

                        {/* Product Grid */}
                        {filteredProducts.length === 0 ? (
                            <div className="py-32 text-center">
                                <p className="text-2xl font-light text-navy-500">Không tìm thấy sản phẩm phù hợp.</p>
                                <button 
                                    onClick={() => { setSearchQuery(''); setIsSearchOpen(false); }}
                                    className="mt-6 border-b border-navy-800 pb-1 text-sm font-medium tracking-widest hover:text-navy-500 hover:border-navy-500 transition"
                                >
                                    XÓA TÌM KIẾM
                                </button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-12 md:gap-x-10">
                                {filteredProducts.map((product, idx) => (
                                    <ProductCard 
                                        key={product.id} 
                                        product={product} 
                                        index={idx} 
                                    />
                                ))}
                            </div>
                        )}
                    </main>

                    {}
                    <footer className="bg-navy-900 text-white pt-24 pb-12 mt-auto border-t border-navy-800">
                        <div className="max-w-[1400px] mx-auto px-6 md:px-12 grid grid-cols-1 md:grid-cols-4 gap-12">
                            <div className="md:col-span-2">
                                <h1 className="font-display font-bold text-4xl tracking-[0.2em] uppercase text-white mb-6">
                                    Hakul
                                </h1>
                                <p className="text-navy-500 text-sm max-w-sm leading-relaxed font-light">
                                    Defining modern masculinity through premium grooming essentials. Authentic, purposeful, and uncompromised.
                                </p>
                            </div>
                            
                            <div>
                                <h4 className="font-medium text-xs tracking-[0.15em] text-white uppercase mb-6">Explore</h4>
                                <ul className="space-y-4 text-sm text-navy-500 font-light">
                                    <li><a href="https://shopee.vn/hakullifestyle" target="_blank" rel="noopener noreferrer" className="hover:text-white transition">Shopee Store</a></li>
                                    <li><a href="#" className="hover:text-white transition">About Us</a></li>
                                    <li><a href="#" className="hover:text-white transition">Store Policy</a></li>
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="font-medium text-xs tracking-[0.15em] text-white uppercase mb-6">Connect</h4>
                                <div className="flex gap-4">
                                    <a href="#" className="w-10 h-10 rounded-full border border-navy-700 flex items-center justify-center text-navy-500 hover:bg-white hover:text-navy-900 hover:border-white transition">
                                        <i className="fab fa-instagram"></i>
                                    </a>
                                    <a href="#" className="w-10 h-10 rounded-full border border-navy-700 flex items-center justify-center text-navy-500 hover:bg-white hover:text-navy-900 hover:border-white transition">
                                        <i className="fab fa-facebook-f"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-[1400px] mx-auto px-6 md:px-12 mt-20 pt-8 border-t border-navy-800 flex flex-col md:flex-row justify-between items-center text-xs text-navy-500 font-light">
                            <p>© 2026 HAKUL LIFESTYLE. ALL RIGHTS RESERVED.</p>
                            <p className="mt-4 md:mt-0">DESIGNED FOR EXCELLENCE.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
